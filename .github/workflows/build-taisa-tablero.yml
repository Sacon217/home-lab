name: build-taisa-tablero
on:
  push:
    branches: [main]
    paths:
      - 'projects/taisa-tablero/**'
      - '.github/workflows/build-taisa-tablero.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./projects/taisa-tablero
          push: true
          tags: |
            ghcr.io/sacon217/taisa-tablero:latest
            ghcr.io/sacon217/taisa-tablero:${{ github.sha }}
