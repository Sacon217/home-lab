services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: "America/Costa_Rica"
      GO2RTC_USER: ${GO2RTC_USER}
      GO2RTC_PASS: ${GO2RTC_PASS}
    volumes:
      - "/srv/docker/go2rtc/config:/config"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    network_mode: host
    depends_on:
      - go2rtc
    environment:
      TZ: "America/Costa_Rica"
      GO2RTC_URL: "http://${GO2RTC_USER}:${GO2RTC_PASS}@127.0.0.1:1984"
    volumes:
      - "/srv/docker/homeassistant/config:/config"
      - "/run/dbus:/run/dbus:ro"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8123/manifest.json > /dev/null || exit 1"]
      interval: 60s
      start_period: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"