services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    # Host mode: Xiaomi P2P talks UDP to the cameras and WebRTC avoids Docker NAT.
    # Ports on the host: 1984 (web UI/API), 8554 (RTSP), 8555 (WebRTC).
    network_mode: host
    environment:
      TZ: "America/Costa_Rica"
    volumes:
      # go2rtc.yaml lives here. It holds camera passwords and Xiaomi keys,
      # so it stays outside the repo.
      - "/srv/docker/go2rtc:/config"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"